databases:
  - name: flowset-db
    plan: free
    databaseName: flowset
    user: flowset
    region: oregon

services:
  - type: web
    name: flowset-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: APPLICATION_ENV
        value: staging
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: STORAGE_PROVIDER
        value: local
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_SEED_PASSWORD
        value: DemoPassw0rd!
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowset-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: flowset-web
          type: web
          property: host
      - key: FRONTEND_URL
        fromService:
          name: flowset-web
          type: web
          property: host
      - key: STORAGE_PUBLIC_HOST
        fromService:
          name: flowset-web
          type: web
          property: host

  - type: web
    name: flowset-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_NAME
        value: FlowSet
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: NEXT_PUBLIC_ENABLE_ANALYTICS
        value: "false"
      - key: NEXT_PUBLIC_ENABLE_DARK_MODE
        value: "true"
      - key: API_HOST
        fromService:
          name: flowset-api
          type: web
          property: host
