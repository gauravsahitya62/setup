# Production profile. Never commit real credentials.
# Activate with SPRING_PROFILES_ACTIVE=prod
# Required secrets: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, DATABASE_*, CORS_ALLOWED_ORIGINS,
# COOKIE_SECURE=true, AWS_REGION, AWS_S3_BUCKET (when STORAGE_PROVIDER=s3).

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  datasource:
    hikari:
      # One API task: 20 connections. RDS db.t3.micro default max_connections ~87.
      # Leave headroom for migrations, admin tools, and a second task during rolling deploy.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1700000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

flowset:
  app:
    env: ${APPLICATION_ENV:production}
  cookie:
    secure: true
    same-site: ${COOKIE_SAME_SITE:None}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
  rate-limit:
    enabled: true
  demo-seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.flowset: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
