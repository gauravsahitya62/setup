spring:
  datasource:
    url: jdbc:h2:mem:flowset;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

flowset:
  app:
    env: test
  jwt:
    access-secret: test-access-secret-must-be-at-least-32-chars-long!!
    refresh-secret: test-refresh-secret-must-be-at-least-32-chars-long!
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
    refresh-cookie-name: flowset_refresh
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    secure: false
    same-site: Lax
  storage:
    provider: local
    local-root: ./uploads-test
    public-base-url: http://localhost:8080/api/v1/files
  rate-limit:
    enabled: false

logging:
  level:
    com.flowset: DEBUG
