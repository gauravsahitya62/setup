server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowset}
    username: ${DATABASE_USERNAME:flowset}
    password: ${DATABASE_PASSWORD:flowset}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}

flowset:
  app:
    env: ${APPLICATION_ENV:development}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-must-be-at-least-32-characters}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-must-be-at-least-32-characters}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-cookie-name: flowset_refresh
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    secure: false
    same-site: Lax
  storage:
    provider: local
    local-root: ${STORAGE_LOCAL_ROOT:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/v1/files}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

springdoc:
  swagger-ui:
    enabled: true
