# Staging profile. Secrets must come from the environment or AWS Secrets Manager.
# Activate with SPRING_PROFILES_ACTIVE=staging.

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:3}
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate

flowset:
  app:
    env: ${APPLICATION_ENV:staging}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
  rate-limit:
    enabled: true

management:
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.flowset: INFO
